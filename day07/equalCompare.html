<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        const comp1 = '11';
        const comp2 = 11;

        //값만 비교
        if( comp1 == comp2) console.log(`${comp1} == ${comp2}는 같다`);
        
        // 값과 타입을 비교
        if(comp1 === comp2) console.log(`${comp1} === ${comp2}는 같다`);




    </script>
</body>
</html>
