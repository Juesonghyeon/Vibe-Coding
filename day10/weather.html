<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>날씨 검색 앱</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="container">

    <!-- 검색창 -->
    <div class="search-section text-center">
      <h1 class="text-white fw-bold mb-4">날씨 검색</h1>
      <div class="d-flex justify-content-center">
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="도시명을 입력하세요 (예: Seoul, Tokyo)"
          style="width: 100%; max-width: 360px;"
        />
        <button id="search-btn" class="search-btn">검색</button>
      </div>
    </div>

    <!-- 로딩 -->
    <div id="loading" class="text-center text-white my-4 d-none">
      <div class="spinner-border text-light" role="status"></div>
      <p class="mt-2">날씨 정보를 불러오는 중...</p>
    </div>

    <!-- 에러 메시지 -->
    <div id="error-message" class="error-box d-none"></div>

    <!-- 날씨 카드 -->
    <div id="weather-card" class="weather-card d-none mt-3">

      <!-- 도시명 & 날씨 설명 -->
      <div class="text-center mb-3">
        <div id="city-name" class="city-name"></div>
        <div id="weather-desc" class="weather-desc"></div>
      </div>

      <!-- 아이콘 & 현재 기온 -->
      <div class="d-flex align-items-center justify-content-center gap-3 mb-2">
        <img id="weather-icon" class="weather-icon" src="" alt="" />
        <div id="temp-current" class="temp-current"></div>
      </div>

      <!-- 최저 / 최고 기온 -->
      <div class="text-center temp-range mb-4">
        최저 <span id="temp-min" class="fw-semibold"></span>
        &nbsp;/&nbsp;
        최고 <span id="temp-max" class="fw-semibold"></span>
      </div>

      <!-- 풍속 / 풍향 -->
      <div class="row g-3">
        <div class="col-6">
          <div class="info-box">
            <div class="info-label">풍속</div>
            <div id="wind-speed" class="info-value"></div>
          </div>
        </div>
        <div class="col-6">
          <div class="info-box">
            <div class="info-label">풍향</div>
            <div id="wind-dir" class="info-value"></div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
