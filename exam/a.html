<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>날씨 검색</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px;
      color: #fff;
    }

    h1 { font-size: 2rem; margin-bottom: 8px; }
    .subtitle { font-size: 0.9rem; color: #a0aec0; margin-bottom: 32px; }

    .api-key-section {
      width: 100%; max-width: 520px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .api-key-section label {
      display: block; font-size: 0.78rem; font-weight: 600;
      color: #90cdf4; text-transform: uppercase; margin-bottom: 8px;
    }
    .api-key-row { display: flex; gap: 10px; }
    .api-key-section input {
      flex: 1; padding: 10px 14px; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(0,0,0,0.3); color: #fff; font-size: 0.88rem; outline: none;
    }
    .btn-sm {
      padding: 10px 14px; border-radius: 10px; border: none;
      background: rgba(255,255,255,0.12); color: #fff;
      font-size: 0.82rem; cursor: pointer;
    }
    .api-key-hint { font-size: 0.75rem; color: #718096; margin-top: 8px; }
    .api-key-hint a { color: #90cdf4; text-decoration: none; }

    .unit-toggle { display: flex; gap: 6px; margin-bottom: 24px; }
    .unit-btn {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.2);
      background: transparent; color: #a0aec0; font-size: 0.85rem; cursor: pointer;
    }
    .unit-btn.active { background: rgba(99,179,237,0.25); border-color: #63b3ed; color: #fff; }

    .search-section { width: 100%; max-width: 520px; display: flex; gap: 10px; margin-bottom: 32px; }
    .search-input {
      flex: 1; padding: 14px 20px; border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08); color: #fff; font-size: 1rem; outline: none;
    }
    .search-input::placeholder { color: #718096; }
    .btn-search {
      padding: 14px 24px; border-radius: 14px; border: none;
      background: linear-gradient(135deg, #3182ce, #2b6cb0);
      color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    .btn-location {
      padding: 14px 16px; border-radius: 14px; border: none;
      background: rgba(255,255,255,0.1); color: #fff; font-size: 1.2rem; cursor: pointer;
    }

    .loading { display: none; font-size: 0.92rem; color: #a0aec0; margin-bottom: 16px; align-items: center; gap: 8px; }
    .loading.show { display: flex; }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #63b3ed;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg {
      width: 100%; max-width: 520px;
      background: rgba(245,101,101,0.15); border: 1px solid rgba(245,101,101,0.3);
      border-radius: 14px; padding: 16px 20px;
      font-size: 0.92rem; color: #fc8181; display: none;
    }
    .error-msg.show { display: block; }

    .weather-card {
      width: 100%; max-width: 520px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px; padding: 32px; display: none;
      animation: fadeInUp 0.4s ease;
    }
    .weather-card.show { display: block; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-header { display: flex; justify-content: space-between; margin-bottom: 24px; }
    .city-name { font-size: 1.6rem; font-weight: 700; }
    .country-code { font-size: 0.9rem; color: #a0aec0; margin-top: 4px; }
    .weather-icon-wrap img { width: 80px; height: 80px; }
    .weather-desc { font-size: 0.9rem; color: #a0aec0; text-align: right; }

    .temp-main {
      font-size: 5rem; font-weight: 700; line-height: 1;
      background: linear-gradient(135deg, #fff 60%, #90cdf4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .temp-range { display: flex; gap: 16px; margin: 4px 0 4px; }
    .temp-range .max { font-size: 0.88rem; color: #fc8181; }
    .temp-range .min { font-size: 0.88rem; color: #90cdf4; }
    .feels-like { font-size: 0.9rem; color: #a0aec0; margin-bottom: 24px; }

    hr.divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); margin: 20px 0; }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stat-item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px 12px; text-align: center;
    }
    .stat-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .stat-value { font-size: 1rem; font-weight: 600; }
    .stat-label { font-size: 0.72rem; color: #718096; margin-top: 2px; text-transform: uppercase; }

    .sun-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .sun-item {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 12px;
    }
    .sun-emoji { font-size: 1.6rem; }
    .sun-label { font-size: 0.72rem; color: #718096; text-transform: uppercase; }
    .sun-value { font-size: 1rem; font-weight: 600; }

    .updated-time { font-size: 0.75rem; color: #4a5568; text-align: right; margin-top: 20px; }
    footer { margin-top: 40px; font-size: 0.75rem; color: #4a5568; }
    footer a { color: #63b3ed; }
  </style>
</head>
<body>

  <h1>🌤 날씨 검색</h1>
  <p class="subtitle">OpenWeatherMap API 실시간 날씨 조회</p>

  <div class="api-key-section">
    <label>🔑 API 키</label>
    <div class="api-key-row">
      <input type="password" id="apiKey" placeholder="OpenWeatherMap API 키 입력" />
      <button class="btn-sm" onclick="toggleKey()">👁</button>
      <button class="btn-sm" onclick="saveKey()">저장</button>
    </div>
    <p class="api-key-hint">
      키가 없으신가요? <a href="https://openweathermap.org/appid" target="_blank">무료 발급하기</a>
    </p>
  </div>

  <div class="unit-toggle">
    <button class="unit-btn active" onclick="setUnit('metric', this)">°C</button>
    <button class="unit-btn" onclick="setUnit('imperial', this)">°F</button>
    <button class="unit-btn" onclick="setUnit('standard', this)">K</button>
  </div>

  <div class="search-section">
    <input class="search-input" type="text" id="cityInput"
      placeholder="도시명 입력 (예: Seoul, Tokyo)"
      onkeydown="if(event.key==='Enter') search()" />
    <button class="btn-location" onclick="searchByLocation()">📍</button>
    <button class="btn-search" onclick="search()">검색</button>
  </div>

  <div class="loading" id="loading"><div class="spinner"></div>불러오는 중...</div>
  <div class="error-msg" id="errorMsg"></div>

  <div class="weather-card" id="card">
    <div class="card-header">
      <div>
        <div class="city-name" id="cityName"></div>
        <div class="country-code" id="countryCode"></div>
      </div>
      <div class="weather-icon-wrap">
        <img id="icon" src="" alt="" />
        <div class="weather-desc" id="desc"></div>
      </div>
    </div>
    <div class="temp-main" id="temp"></div>
    <div class="temp-range">
      <span class="max" id="tMax"></span>
      <span class="min" id="tMin"></span>
    </div>
    <div class="feels-like" id="feelsLike"></div>
    <hr class="divider" />
    <div class="stats-grid">
      <div class="stat-item"><div class="stat-icon">💧</div><div class="stat-value" id="humidity"></div><div class="stat-label">습도</div></div>
      <div class="stat-item"><div class="stat-icon">💨</div><div class="stat-value" id="wind"></div><div class="stat-label">풍속</div></div>
      <div class="stat-item"><div class="stat-icon">🌡️</div><div class="stat-value" id="pressure"></div><div class="stat-label">기압</div></div>
      <div class="stat-item"><div class="stat-icon">👁️</div><div class="stat-value" id="visibility"></div><div class="stat-label">가시거리</div></div>
      <div class="stat-item"><div class="stat-icon">☁️</div><div class="stat-value" id="clouds"></div><div class="stat-label">구름량</div></div>
      <div class="stat-item"><div class="stat-icon">🧭</div><div class="stat-value" id="windDir"></div><div class="stat-label">풍향</div></div>
    </div>
    <div class="sun-row">
      <div class="sun-item"><div class="sun-emoji">🌅</div><div><div class="sun-label">일출</div><div class="sun-value" id="sunrise"></div></div></div>
      <div class="sun-item"><div class="sun-emoji">🌇</div><div><div class="sun-label">일몰</div><div class="sun-value" id="sunset"></div></div></div>
    </div>
    <div class="updated-time" id="updated"></div>
  </div>

  <footer>Powered by <a href="https://openweathermap.org" target="_blank">OpenWeatherMap</a></footer>

  <script>
    let unit = 'metric';
    let lastLat = null, lastLon = null, lastCity = null;

    window.onload = () => {
      const saved = localStorage.getItem('owm_key');
      if (saved) document.getElementById('apiKey').value = saved;
    };

    function saveKey() {
      const k = document.getElementById('apiKey').value.trim();
      if (k) localStorage.setItem('owm_key', k);
    }

    function toggleKey() {
      const el = document.getElementById('apiKey');
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    function setUnit(u, btn) {
      unit = u;
      document.querySelectorAll('.unit-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (lastLat) fetchCoords(lastLat, lastLon);
      else if (lastCity) fetchCity(lastCity);
    }

    async function search() {
    let input = document.getElementById('cityInput').value.trim();
    if (!input) return showError('도시명을 입력해주세요.');

    // 한글 포함 여부 확인
    if (/[ㄱ-ㅎ|ㅏ-ㅣ|가-힣]/.test(input)) {
        input = await translateToEnglish(input);
        if (!input) return showError('번역에 실패했습니다. 영문 도시명으로 시도해보세요.');
    }

    lastCity = input; lastLat = null;
    fetchCity(input);
    }

    function searchByLocation() {
      if (!navigator.geolocation) return showError('위치 정보를 사용할 수 없습니다.');
      setLoading(true);
      navigator.geolocation.getCurrentPosition(
        pos => { lastLat = pos.coords.latitude; lastLon = pos.coords.longitude; lastCity = null; fetchCoords(lastLat, lastLon); },
        () => { setLoading(false); showError('위치 권한을 허용해주세요.'); }
      );
    }

    const BASE = 'https://api.openweathermap.org/data/2.5/weather';

    async function fetchCity(city) {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return showError('API 키를 입력해주세요.');
      setLoading(true); hideError();
      try {
        const r = await fetch(`${BASE}?q=${encodeURIComponent(city)}&appid=${key}&units=${unit}&lang=kr`);
        const d = await r.json();
        if (d.cod !== 200) throw new Error(errMsg(d.cod));
        render(d);
      } catch(e) { showError(e.message); }
      finally { setLoading(false); }
    }

    async function fetchCoords(lat, lon) {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return showError('API 키를 입력해주세요.');
      setLoading(true); hideError();
      try {
        const r = await fetch(`${BASE}?lat=${lat}&lon=${lon}&appid=${key}&units=${unit}&lang=kr`);
        const d = await r.json();
        if (d.cod !== 200) throw new Error(errMsg(d.cod));
        render(d);
      } catch(e) { showError(e.message); }
      finally { setLoading(false); }
    }

    function render(d) {
      const sym = unit === 'metric' ? '°C' : unit === 'imperial' ? '°F' : 'K';
      document.getElementById('cityName').textContent = d.name;
      document.getElementById('countryCode').textContent = `📍 ${d.sys.country}  lat ${d.coord.lat.toFixed(2)}°, lon ${d.coord.lon.toFixed(2)}°`;
      document.getElementById('icon').src = `https://openweathermap.org/img/wn/${d.weather[0].icon}@2x.png`;
      document.getElementById('desc').textContent = d.weather[0].description;
      document.getElementById('temp').textContent = `${Math.round(d.main.temp)}${sym}`;
      document.getElementById('tMax').textContent = `↑ ${Math.round(d.main.temp_max)}${sym}`;
      document.getElementById('tMin').textContent = `↓ ${Math.round(d.main.temp_min)}${sym}`;
      document.getElementById('feelsLike').textContent = `체감 ${Math.round(d.main.feels_like)}${sym}`;
      document.getElementById('humidity').textContent = `${d.main.humidity}%`;
      document.getElementById('wind').textContent = `${d.wind.speed.toFixed(1)} ${unit==='imperial'?'mph':'m/s'}`;
      document.getElementById('pressure').textContent = `${d.main.pressure} hPa`;
      document.getElementById('visibility').textContent = d.visibility ? `${(d.visibility/1000).toFixed(1)} km` : '-';
      document.getElementById('clouds').textContent = `${d.clouds.all}%`;
      document.getElementById('windDir').textContent = degToDir(d.wind.deg);
      document.getElementById('sunrise').textContent = toTime(d.sys.sunrise, d.timezone);
      document.getElementById('sunset').textContent  = toTime(d.sys.sunset,  d.timezone);
      document.getElementById('updated').textContent = `업데이트: ${new Date().toLocaleTimeString('ko-KR')}`;
      document.getElementById('card').classList.add('show');
    }

    function toTime(unix, tz) {
      const d = new Date((unix + tz) * 1000);
      return `${String(d.getUTCHours()).padStart(2,'0')}:${String(d.getUTCMinutes()).padStart(2,'0')}`;
    }

    function degToDir(deg) {
      const dirs = ['북','북북동','북동','동북동','동','동남동','남동','남남동','남','남남서','남서','서남서','서','서북서','북서','북북서'];
      return dirs[Math.round(deg / 22.5) % 16];
    }

    function errMsg(cod) {
      return { 401:'유효하지 않은 API 키입니다.', 404:'도시를 찾을 수 없습니다.', 429:'호출 한도 초과, 잠시 후 재시도해주세요.' }[cod] || `오류 코드: ${cod}`;
    }

    function setLoading(v) {
      document.getElementById('loading').classList.toggle('show', v);
      if (v) document.getElementById('card').classList.remove('show');
    }
    function showError(msg) { const e = document.getElementById('errorMsg'); e.textContent = '⚠️ ' + msg; e.classList.add('show'); }
    function hideError() { document.getElementById('errorMsg').classList.remove('show'); }

    async function translateToEnglish(text) {
        try {
            const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ko|en`;
            const res = await fetch(url);
            const data = await res.json();
            if (data.responseStatus === 200) {
            return data.responseData.translatedText;
            }
            return null;
        } catch {
            return null;
        }
    }
  </script>
</body>
</html>
