<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>
        자바스크립트 예제
    </h1>
    <div id="result">

    </div>
</body>
<script>

    const arr = [];

    for(let i = 0; i < 10; i++){
        const rand = Math.floor(Math.random() * 100) + 1;
        arr.push(rand);
    }

    const div = document.querySelector('#result');
    // div에 출력
    for(val of arr){
        div.append(val +', ')
    }

    /* 배열은 기능이 무지하게 많습니다. 그중에서 꼭 필요한 것 보시지요. */

    //map 함수
    // 요소를 하나씩 순회해서 반환
    // 반환되는 요소를 처리할 콜백함수가 필수

    // 콜백함수는 반드시 return 이 있는 형태
    // 콜백함수는 배열의 각 index, 배열자신을 매개변수로 받을 수 있음
    // 매개변수의 순서는 바꿀 수 없음

    // 원본 내용은 변경되지 않습니다.

    const arr02 = arr.map(
        (val, index) =>{
            return val * 2;
        }
    );

    console.log(arr02);

    //filter 함수
    // 말 그대로 함수의 값을 필터링하기 위한 함수
    // map 처럼 filter 함수는 콜백함수를 필수로 가진다.
    // 콜백함수에 전달되는 매개변수는 map 과 동일
    // 콜백함수는 반드시 return 이 있어야 함.
    // return 결과는 true 또는 false 여야 한다.
    // return 이 true 인 값만 모아서 새로운 배열로 리턴
    // 그래서 원본내용은 변경 없음

    const arr03 = arr.filter((val, index) => val % 2 == 0);

    console.log(arr03)
</script>
</html>
