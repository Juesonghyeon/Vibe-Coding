<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>더하기</title>
    <style>
        .btn-blue {
            background-color: #1a6fd4;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-blue:hover {
            background-color: #1558aa;
        }
    </style>
</head>
<body>
    <input type="number" id="num1" placeholder="첫 번째 숫자">
    +
    <input type="number" id="num2" placeholder="두 번째 숫자">
    <button class="btn-blue" onclick="add()">계산</button>
    <p>결과: <span id="result"></span></p>

    <script>
        function add() {
            const num1 = Number(document.getElementById('num1').value);
            const num2 = Number(document.getElementById('num2').value);
            document.getElementById('result').textContent = num1 + num2;
        }
    </script>
</body>
</html>
